{s:()=>sky('cc','#8fd3ff','#e3f6ff')+sun(345,45)+cloud(150,45,.6,1)+bushes()+road()+familyCar(150,272,'fc')+kid(325,262,'rory',{s:1.25,r:'up',anim:'hop'})+bubble(90,90,T('Папин трак!'),0,1.2,40)+bubble(320,60,T('Привет, дядя Рори!'),0,2,0),

{s:()=>diner()+kid(200,262,'leoB',{l:'fwd',r:'fwd',laugh:1})+`<g class="wobble"><ellipse cx="204" cy="212" rx="9" ry="6" fill="#9ccc3c" stroke="#5a8a1c" stroke-width="2"/></g>`+meal()+bubble(90,90,T('Ням-ням!'),0,.4,30)+bubble(310,96,T('Хрум!'),0,1.2,-30),
 t:{"ru": "<p class=\"say\">— Пока, дядя Рори! Спасибо!</p><p>А потом — в бургерную. Лео ест бургер и хрустит огурчиком: <span class=\"say\">хрум-хрум! Ням-ням!</span></p>", "it": "<p class=\"say\">— Ciao, zio Rory! Grazie!</p><p>E poi tutti a mangiare hamburger. Leo mangia l’hamburger e sgranocchia un cetriolino: <span class=\"say\">crunch-crunch! Gnam-gnam!</span></p>", "en": "<p class=\"say\">“Bye, Uncle Rory! Thank you!”</p><p>Then off to the burger place. Leo eats his burger and crunches a pickle: <span class=\"say\">crunch-crunch! Yum-yum!</span></p>", "es": "<p class=\"say\">—¡Adiós, tío Rory! ¡Gracias!</p><p>Y después, a la hamburguesería. Leo come su hamburguesa y muerde un pepinillo: <span class=\"say\">¡crac-crac! ¡Ñam-ñam!</span></p>"}},
{s:()=>night('cg')+palm(20,200,.7)+palm(380,205,.6)+cybercab()+kid(40,312,'leoB',{s:.85,r:'up',laugh:1})+kid(365,318,'david',{s:1.05,l:'up',laugh:1})+bubble(130,70,T('Ух ты!'),0,.4,-40)+bubble(270,40,T('Само едет!'),0,1.4,0),
 t:{"ru": "<p>На улице уже темно. И вдруг… <span class=\"say\">— Ух ты!</span></p><p>Мимо едет золотое такси-робот Тесла. В нём даже руля нет — оно едет само!</p>", "it": "<p>Fuori è già buio. E all’improvviso… <span class=\"say\">— Uau!</span></p><p>Passa un taxi-robot Tesla tutto dorato. Non ha nemmeno il volante: guida da solo!</p>", "en": "<p>It’s already dark outside. And suddenly… <span class=\"say\">“Wow!”</span></p><p>A golden Tesla robot taxi drives by. It doesn’t even have a steering wheel. It drives all by itself!</p>", "es": "<p>Afuera ya está oscuro. Y de pronto… <span class=\"say\">—¡Guau!</span></p><p>Pasa un taxi robot Tesla todo dorado. ¡No tiene ni volante: conduce solito!</p>"}},
{s:()=>room(1)+sleepyBed()+louie(62,272,.5)+lenny(372,262,.5)+[0,1,2].map(k=>`<text class="zzz" style="animation-delay:${k}s" x="190" y="150" font-size="${18+k*4}" font-weight="900" fill="#fff">z</text>`).join('')+thought(300,90,toyCar(300,108,'#e8433f',.6,1)+`<g transform="translate(276 70) scale(.35)"><path d="M0 0 h30 l10 10 v10 h-50 v-10z" fill="#c9a65a" stroke="${INK}" stroke-width="3"/></g>`),
 t:{"ru": "<p>Домой — на папином траке! Дома Лео лёг в кроватку и вспомнил: машинки, гонки, бургеры и золотое такси!</p><p class=\"say\">— Какой классный день, папа!</p><p>И сладко уснул. <b>Конец!</b></p>", "it": "<p>A casa sul pick-up di papà! Lì Leo si mette nel lettino e ricorda: macchinine, gare, hamburger e il taxi dorato!</p><p class=\"say\">— Che giornata fantastica, papà!</p><p>E si addormenta. <b>Fine!</b></p>", "en": "<p>Home in Daddy’s truck! At home Leo climbs into bed and remembers: toy cars, races, burgers and the golden taxi!</p><p class=\"say\">“What a great day, Daddy!”</p><p>And he falls fast asleep. <b>The End!</b></p>", "es": "<p>¡A casa en la camioneta de papá! Allí Leo se acuesta en su camita y recuerda: ¡cochecitos, carreras, hamburguesas y el taxi dorado!</p><p class=\"say\">—¡Qué día tan genial, papá!</p><p>Y se queda dormidito. <b>¡Fin!</b></p>"}}
],
zhuzha:[
{s:()=>sky('a','#7fcbff','#d9f2ff')+sun(330,60)+cloud(70,60,1)+cloud(250,40,.7,1)+ground()+zh(200,150,1.45),
 t:{ru:"<h1>Дрончик Жужа</h1><p class=\"sub\">Сказка для самых маленьких</p><span class=\"hint\">Нажми на Жужу!</span>",it:"<h1>Il dronetto Zuzù</h1><p class=\"sub\">Una storia per i più piccoli</p><span class=\"hint\">Tocca Zuzù!</span>",en:"<h1>Zhuzha the Little Drone</h1><p class=\"sub\">A story for little ones</p><span class=\"hint\">Tap Zhuzha!</span>",es:"<h1>Zuzú, el pequeño dron</h1><p class=\"sub\">Un cuento para los más pequeños</p><span class=\"hint\">¡Toca a Zuzú!</span>"}},
{s:()=>room()+zh(297,166,.85),
 t:{ru:"<p>Жил-был маленький дрон. Звали его Жужа, потому что он всегда жужжал: <span class=\"say\">«Жжжж! Жжжж!»</span></p><p>У Жужи было четыре пропеллера, два светящихся глазика и большое желание всё-всё увидеть.</p>",it:"<p>C’era una volta un piccolo drone. Si chiamava Zuzù, perché ronzava sempre: <span class=\"say\">«Bzzz! Bzzz!»</span></p><p>Zuzù aveva quattro eliche, due occhietti luminosi e tanta voglia di vedere tutto tutto.</p>",en:"<p>Once upon a time there was a little drone. His name was Zhuzha, because he always buzzed: <span class=\"say\">“Bzzz! Bzzz!”</span></p><p>Zhuzha had four propellers, two shiny little eyes and a big wish to see everything.</p>",es:"<p>Había una vez un pequeño dron. Se llamaba Zuzú, porque siempre zumbaba: <span class=\"say\">«¡Bzzz! ¡Bzzz!»</span></p><p>Zuzú tenía cuatro hélices, dos ojitos brillantes y muchas ganas de verlo todo.</p>"}},
{s:()=>sky('b','#8fd3ff','#e3f6ff')+sun(60,52)+cloud(220,50,.8)+cloud(340,90,.6,1)+ground()+
   `<g transform="translate(40 250)"><rect x="0" y="-60" width="90" height="60" fill="#fff3d6" stroke="${INK}" stroke-width="2.5"/><path d="M-10 -58 L45 -100 L100 -58Z" fill="#e8433f" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><rect x="14" y="-44" width="22" height="20" fill="#9ad8ff" stroke="${INK}" stroke-width="2"/><rect x="54" y="-36" width="22" height="36" rx="3" fill="#a0643a"/></g>`+
   zh(240,120,.9,'','rise')+bubble(340,58,T('Вжух!'),90,1.8,-24),
 t:{ru:"<p>Однажды утром Жужа проснулся и сказал:</p><p class=\"say\">— Сегодня я полечу высоко-высоко!</p><p>Вжух! И он взлетел над домиком.</p>",it:"<p>Una mattina Zuzù si svegliò e disse:</p><p class=\"say\">— Oggi volerò in alto, in alto!</p><p>Vuuush! E volò sopra la casetta.</p>",en:"<p>One morning Zhuzha woke up and said:</p><p class=\"say\">“Today I’ll fly high, high up!”</p><p>Whoosh! And he flew over the little house.</p>",es:"<p>Una mañana Zuzú se despertó y dijo:</p><p class=\"say\">—¡Hoy volaré muy, muy alto!</p><p>¡Zuuum! Y voló sobre la casita.</p>"}},
{s:()=>sky('c','#8fd3ff','#e3f6ff')+cloud(70,250,.9)+cloud(200,40,.6,1)+branch()+bird(290,168)+zh(110,135,.85)+
   bubble(290,108,T('Чик-чирик! Ты кто?'),188,.4,0)+bubble(120,52,T('Я Жужа! Жжжж!'),158,1.8,-10),
 t:{ru:"<p>В небе Жужа встретил птичку.</p><p class=\"say\">— Чик-чирик! Ты кто?</p><p class=\"say\">— Я Жужа! Жжжж!</p><p>— А почему у тебя нет крылышек? — Зато у меня пропеллеры!</p>",it:"<p>In cielo Zuzù incontrò un uccellino.</p><p class=\"say\">— Cip-cip! Chi sei?</p><p class=\"say\">— Sono Zuzù! Bzzz!</p><p>— Perché non hai le ali? — Però ho le eliche!</p>",en:"<p>In the sky Zhuzha met a little bird.</p><p class=\"say\">“Tweet-tweet! Who are you?”</p><p class=\"say\">“I’m Zhuzha! Bzzz!”</p><p>“Why don’t you have wings?” “I have propellers instead!”</p>",es:"<p>En el cielo Zuzú conoció a un pajarito.</p><p class=\"say\">—¡Pío-pío! ¿Quién eres?</p><p class=\"say\">—¡Soy Zuzú! ¡Bzzz!</p><p>—¿Por qué no tienes alas? —¡Pero tengo hélices!</p>"}},
{s:()=>sky('d','#8fd3ff','#e3f6ff')+cloud(80,250,.9)+cloud(220,36,.6,1)+branch()+bird(290,168,1)+zh(135,150,.9,'','twirl')+
   bubble(300,108,T('Ха-ха-ха!'),120,.3,-10)+bubble(140,42,T('Раз, два, три!'),150,.9,0),
 t:{ru:"<p>И Жужа закружился: раз, два, три!</p><p>Птичка засмеялась: <span class=\"say\">«Чик-чирик-ха-ха!»</span></p>",it:"<p>E Zuzù fece una giravolta: uno, due, tre!</p><p>L’uccellino rise: <span class=\"say\">«Cip-cip-ah-ah!»</span></p>",en:"<p>And Zhuzha spun around: one, two, three!</p><p>The little bird laughed: <span class=\"say\">“Tweet-tweet-ha-ha!”</span></p>",es:"<p>Y Zuzú dio vueltas: ¡uno, dos, tres!</p><p>El pajarito se rio: <span class=\"say\">«¡Pío-pío-ja-ja!»</span></p>"}},
{s:()=>sky('e','#a8dcff','#eaf7ff')+cloud(80,40,.7)+cloud(330,60,.5,1)+
   `<rect x="252" y="128" width="26" height="50" fill="#9a5f35" stroke="${INK}" stroke-width="2.5"/><rect x="80" y="200" width="240" height="100" fill="#ff8c69" stroke="${INK}" stroke-width="2.5"/><path d="M56 208 L200 140 L344 208Z" fill="#c0392b" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><rect x="120" y="222" width="44" height="40" fill="#9ad8ff" stroke="${INK}" stroke-width="2.5"/><rect x="236" y="222" width="44" height="40" fill="#9ad8ff" stroke="${INK}" stroke-width="2.5"/>`+
   cat(200,144)+zh(320,110,.75,'','escape')+bubble(92,92,T('Мяу! Ты муха?'),150,.4,40),
 t:{ru:"<p>Полетел Жужа дальше и увидел котика на крыше.</p><p class=\"say\">— Мяу! Ты муха?</p><p class=\"say\">— Нет, я дрон! Жжжж!</p><p>Котик хотел поймать Жужу лапкой, а Жужа — вжух! — и вверх. <span class=\"say\">«Мяу, не поймал!»</span></p>",it:"<p>Zuzù volò più avanti e vide un gattino sul tetto.</p><p class=\"say\">— Miao! Sei una mosca?</p><p class=\"say\">— No, sono un drone! Bzzz!</p><p>Il gattino voleva prenderlo con la zampa, ma Zuzù — vuuush! — su in alto. <span class=\"say\">«Miao, non ti ho preso!»</span></p>",en:"<p>Zhuzha flew on and saw a kitty on a roof.</p><p class=\"say\">“Meow! Are you a fly?”</p><p class=\"say\">“No, I’m a drone! Bzzz!”</p><p>The kitty tried to catch him with a paw, but Zhuzha went whoosh, up and away! <span class=\"say\">“Meow, missed you!”</span></p>",es:"<p>Zuzú siguió volando y vio un gatito en el tejado.</p><p class=\"say\">—¡Miau! ¿Eres una mosca?</p><p class=\"say\">—¡No, soy un dron! ¡Bzzz!</p><p>El gatito quiso atraparlo con la patita, pero Zuzú —¡zuuum!— subió muy alto. <span class=\"say\">«¡Miau, no te atrapé!»</span></p>"}},
{s:()=>sky('f','#8fd3ff','#e3f6ff')+cloud(300,40,.55,1)+ground()+tree(110,262,1)+boy(290,262)+zh(300,100,.7,'','approach')+
   bubble(290,40,T('Не плачь! Я помогу!'),196,1.6,0)+bubble(218,138,T('Уа-уа!'),84,.2,24),
 t:{ru:"<p>Потом Жужа увидел мальчика. Мальчик плакал: его красный мячик застрял на дереве.</p><p class=\"say\">— Не плачь! Я помогу! — сказал Жужа.</p>",it:"<p>Poi Zuzù vide un bambino. Il bambino piangeva: la sua palla rossa era rimasta sull’albero.</p><p class=\"say\">— Non piangere! Ti aiuto io! — disse Zuzù.</p>",en:"<p>Then Zhuzha saw a little boy. The boy was crying: his red ball was stuck in a tree.</p><p class=\"say\">“Don’t cry! I’ll help you!” said Zhuzha.</p>",es:"<p>Luego Zuzú vio a un niño. El niño lloraba: su pelota roja se había quedado en el árbol.</p><p class=\"say\">—¡No llores! ¡Yo te ayudo! —dijo Zuzú.</p>"}},
{s:()=>sky('g','#8fd3ff','#e3f6ff')+cloud(320,40,.55,1)+ground()+tree(110,262)+zh(185,72,.7,'','nudge')+boy(290,262,1)+
   bubble(80,36,T('Тук!'),70,.4,20)+bubble(300,40,T('Ура! Спасибо!'),150,1.8,-10),
 t:{ru:"<p>Жужа толкнул мячик носиком: тук! Мячик упал — бум-бум-бум — прямо мальчику в руки!</p><p class=\"say\">— Ура! Спасибо, Жужа!</p>",it:"<p>Zuzù spinse la palla con il nasino: toc! La palla cadde — bum-bum-bum — proprio tra le mani del bambino!</p><p class=\"say\">— Evviva! Grazie, Zuzù!</p>",en:"<p>Zhuzha pushed the ball with his nose: bonk! The ball fell down, boom-boom-boom, right into the boy’s hands!</p><p class=\"say\">“Yay! Thank you, Zhuzha!”</p>",es:"<p>Zuzú empujó la pelota con la naricita: ¡toc! La pelota cayó —bum-bum-bum— ¡justo en las manos del niño!</p><p class=\"say\">—¡Bien! ¡Gracias, Zuzú!</p>"}},
{s:()=>room(1)+zh(297,166,.85,'sleep')+
   [0,1,2].map(k=>`<text class="zzz" style="animation-delay:${k}s" x="326" y="118" font-size="${18+k*4}" font-weight="900" fill="#fff">z</text>`).join(''),
 t:{ru:"<p>Вечером глазики у Жужи замигали: миг-миг. Он прилетел домой, сел на свою полочку и тихонько прожужжал:</p><p class=\"say\">— Жжж... Какой хороший день...</p><p>И сладко уснул. <b>Конец!</b></p>",it:"<p>La sera gli occhietti di Zuzù fecero blink-blink. Tornò a casa, si posò sulla sua mensola e ronzò piano piano:</p><p class=\"say\">— Bzzz… Che bella giornata…</p><p>E si addormentò. <b>Fine!</b></p>",en:"<p>In the evening Zhuzha’s little eyes went blink-blink. He flew home, landed on his shelf and buzzed softly:</p><p class=\"say\">“Bzzz… What a lovely day…”</p><p>And he fell fast asleep. <b>The End!</b></p>",es:"<p>Por la noche los ojitos de Zuzú hicieron parpadeo-parpadeo. Volvió a casa, se posó en su estante y zumbó bajito:</p><p class=\"say\">—Bzzz… Qué día tan bonito…</p><p>Y se quedó dormidito. <b>¡Fin!</b></p>"}}
],
lr:[
{s:()=>sky('a','#7fcbff','#d9f2ff')+sun(340,55)+cloud(90,60,1)+cloud(250,40,.7,1)+palm(385,250,.9)+ground()+zh(70,120,.5)+
   kid(160,262,'leo',{r:'out',anim:'hop2'})+kid(240,262,'romeo',{l:'out',anim:'hop2'}),
 t:{ru:"<h1>Лео и Ромео</h1><p class=\"sub\">Сказка про двух лучших друзей</p><span class=\"hint\">Нажми на Лео или Ромео!</span>",it:"<h1>Leo e Romeo</h1><p class=\"sub\">La storia di due migliori amici</p><span class=\"hint\">Tocca Leo o Romeo!</span>",en:"<h1>Leo and Romeo</h1><p class=\"sub\">A story about two best friends</p><span class=\"hint\">Tap Leo or Romeo!</span>",es:"<h1>Leo y Romeo</h1><p class=\"sub\">Un cuento de dos mejores amigos</p><span class=\"hint\">¡Toca a Leo o a Romeo!</span>"}},
{s:()=>sky('b','#7fcbff','#d9f2ff')+sun(60,50)+cloud(250,40,.7)+palm(380,255,.9)+ground()+
   kid(135,262,'leo',{r:'up',anim:'hop'})+kid(265,262,'romeo',{l:'up',anim:'hop',st:'animation-delay:.25s'})+
   bubble(110,100,T('Привет, Ромео!'),160,.3,20)+bubble(292,58,T('Привет, Лео!'),146,1.3,-24),
 t:{ru:"<p>Жили-были два лучших друга — Лео и Ромео.</p><p>У Лео тёмные волосы, гладкие-гладкие. А у Ромео — кудряшки, как пружинки: <span class=\"say\">боинг-боинг!</span></p>",it:"<p>C’erano una volta due migliori amici: Leo e Romeo.</p><p>Leo ha i capelli scuri, lisci lisci. Romeo invece ha i riccioli, come tante mollette: <span class=\"say\">boing-boing!</span></p>",en:"<p>Once upon a time there were two best friends: Leo and Romeo.</p><p>Leo has dark hair, smooth and straight. Romeo has curls, bouncy like springs: <span class=\"say\">boing-boing!</span></p>",es:"<p>Había una vez dos mejores amigos: Leo y Romeo.</p><p>Leo tiene el pelo oscuro y lisito. Romeo tiene rizos, como resortitos: <span class=\"say\">¡boing-boing!</span></p>"}},
{s:()=>sky('c','#8fd3ff','#e3f6ff')+sun(345,50)+cloud(120,50,.7)+bushes()+road()+
   bike(125,266,'#2f6fe0','leo','ride')+bike(275,266,'#e8433f','romeo','ride')+bubble(300,80,T('Дзынь-дзынь!'),140,.6,-20),
 t:{ru:"<p>Однажды друзья сели на свои байки. Лео — на синий, Ромео — на красный.</p><p class=\"say\">Дзынь-дзынь! Поехали!</p><p>Колёса крутятся: ш-ш-ш-ш!</p>",it:"<p>Un giorno gli amici salirono sulle loro bici. Leo su quella blu, Romeo su quella rossa.</p><p class=\"say\">Drin-drin! Si parte!</p><p>Le ruote girano: sssss!</p>",en:"<p>One day the friends got on their bikes. Leo on the blue one, Romeo on the red one.</p><p class=\"say\">Ring-ring! Let’s go!</p><p>The wheels spin: shhhhh!</p>",es:"<p>Un día los amigos se subieron a sus bicis. Leo a la azul, Romeo a la roja.</p><p class=\"say\">¡Rin-rin! ¡Vamos!</p><p>Las ruedas giran: ¡shhhh!</p>"}},
{s:()=>sky('d','#8fd3ff','#e3f6ff')+sun(345,50)+cloud(170,40,.6,1)+`<path d="M0 140 L400 285 V300 H0Z" fill="#9bdc7c"/><path d="M0 170 L400 300 H0Z" fill="#6cc25a"/><path d="M14 140 V100 L40 110 L14 120" fill="#e8433f" stroke="${INK}" stroke-width="2"/>`+
   `<g transform="translate(0 140) rotate(19.9)"><g class="down">${bike(0,0,'#2f6fe0','leo')}</g><g class="down" style="animation-delay:-2s">${bike(0,0,'#e8433f','romeo')}</g></g>`+
   bubble(280,70,T('Ура-а-а!'),120,.3,0)+bubble(110,40,T('Вжик!'),80,1,0),
 t:{ru:"<p>А вот и горка! Вжик — вниз!</p><p>Ветер дует, кудряшки у Ромео прыгают.</p><p class=\"say\">— Ура-а-а! — кричат друзья.</p>",it:"<p>Ecco una discesa! Ziiip, giù!</p><p>Il vento soffia, i riccioli di Romeo saltellano.</p><p class=\"say\">— Evviva! — gridano gli amici.</p>",en:"<p>Here comes a hill! Zoom, down they go!</p><p>The wind blows, and Romeo’s curls bounce.</p><p class=\"say\">“Wheee!” shout the friends.</p>",es:"<p>¡Aquí hay una cuesta! ¡Zas, para abajo!</p><p>Sopla el viento y los rizos de Romeo saltan.</p><p class=\"say\">—¡Yupiii! —gritan los amigos.</p>"}},
{s:()=>sky('e','#8fd3ff','#e3f6ff')+cloud(70,50,.7)+cloud(330,40,.6,1)+ground()+
   kid(130,262,'leo',{l:'fwd',r:'fwd',remote:1})+kid(270,262,'romeo',{l:'fwd',r:'fwd',remote:1})+
   zh(130,92,.55,'','rise2','y')+`<g style="--d:1">${zh(270,82,.55,'','rise2','b')}</g>`+bubble(200,30,T('Полетели!'),120,2,0),
 t:{ru:"<p>Потом Лео и Ромео взяли пульты. У Лео — жёлтый дрон Жужа, у Ромео — синий дрон Зум.</p><p>Нажали кнопочку — и дроны полетели: <span class=\"say\">жжжж!</span></p>",it:"<p>Poi Leo e Romeo presero i telecomandi. Leo ha il drone giallo Zuzù, Romeo il drone blu Zum.</p><p>Premono il bottoncino e i droni volano via: <span class=\"say\">bzzz!</span></p>",en:"<p>Then Leo and Romeo picked up their remotes. Leo has the yellow drone Zhuzha, Romeo has the blue drone Zoom.</p><p>They press a little button, and the drones fly off: <span class=\"say\">bzzz!</span></p>",es:"<p>Luego Leo y Romeo tomaron los controles. Leo tiene el dron amarillo Zuzú, Romeo el dron azul Zum.</p><p>Aprietan el botoncito y los drones salen volando: <span class=\"say\">¡bzzz!</span></p>"}},
{s:()=>sky('f','#8fd3ff','#e3f6ff')+cloud(60,250,.8)+ground()+orbit('y',0)+orbit('b',-2.5)+

  AU.bus=c.createGain();AU.bus.gain.setValueAtTime(0,c.currentTime);AU.bus.gain.linearRampToValueAtTime(1,c.currentTime+.5);AU.bus.connect(AU.master);

function sound(kind){try{const c=getCtx();const b=AU.bus;AU.bus=AU.master;
  if(kind==='dog')bark();else if(kind==='cat')meow();
  else if(kind==='drone'){const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.type='sawtooth';o.frequency.value=150;l.frequency.value=26;lg.gain.value=35;l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.05);g.gain.setValueAtTime(.1,t+.5);g.gain.linearRampToValueAtTime(0,t+.75);o.connect(g);g.connect(c.destination);l.start(t);l.stop(t+.8);o.start(t);o.stop(t+.8);}
  else boing();

  page.style.setProperty('--from',dir>0?'30px':'-30px');page.style.setProperty('--rot',dir>0?'1deg':'-1deg');
